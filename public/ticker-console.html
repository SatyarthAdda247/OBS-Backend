<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Adda247 OBS Ticker Console & Tester</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.2);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #22c55e;
    }
    body {
      margin: 0;
      padding: 2rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    h1 { font-size: 1.8rem; margin-bottom: 0.5rem; color: var(--accent); }
    p { color: var(--text-muted); margin-top: 0; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }
    .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }
    label { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 0.4rem; }
    input {
      width: 100%;
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: #0f172a;
      color: #fff;
      font-size: 0.95rem;
      box-sizing: border-box;
    }
    button {
      margin-top: 1rem;
      padding: 0.75rem 1.5rem;
      background: var(--accent);
      color: #0f172a;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    pre { background: #0b0f19; padding: 1rem; border-radius: 8px; overflow-x: auto; color: #a5f3fc; }
  </style>
</head>
<body>
  <h1>Adda247 OBS Ticker Rule Tester</h1>
  <p>Test rule resolution for any stream key, lecture title, or channel name</p>

  <div class="card">
    <div class="grid">
      <div>
        <label>Stream Key</label>
        <input type="text" id="testKey" placeholder="e.g. xxxx-xxxx-xxxx-xxxx">
      </div>
      <div>
        <label>Lecture Title</label>
        <input type="text" id="testTitle" placeholder="e.g. SSC CGL Maths Live Class 3">
      </div>
      <div>
        <label>Channel Name</label>
        <input type="text" id="testChannel" placeholder="e.g. SSC CGL">
      </div>
    </div>
    <button onclick="testResolve()">Test Resolve Rule</button>
  </div>

  <div class="card" id="resultCard" style="display:none;">
    <h3>Resolution Result</h3>
    <pre id="resultOutput"></pre>
  </div>

  <script>
    async function testResolve() {
      const streamKey = document.getElementById('testKey').value;
      const title = document.getElementById('testTitle').value;
      const channelName = document.getElementById('testChannel').value;

      const res = await fetch('/api/resolve', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ streamKey, title, channelName })
      });
      const data = await res.json();
      document.getElementById('resultCard').style.display = 'block';
      document.getElementById('resultOutput').innerText = JSON.stringify(data, null, 2);
    }
  </script>
</body>
</html>
